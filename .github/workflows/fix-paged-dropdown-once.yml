name: Fix paged dropdown once
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pagination-release-20260906
          fetch-depth: 0
      - run: python3 tools/fix_paged_dropdown_once.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/enhanced_purchases_page.dart
          git diff --cached --check
          git commit -m 'Preserve paged purchase dropdown selections safely'
          git push origin HEAD:fix/pagination-release-20260906
