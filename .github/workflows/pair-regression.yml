name: Mobile Desktop integration

on:
  pull_request:
    branches:
      - main
      - source/main
  push:
    branches:
      - main
      - source/main
  workflow_dispatch:
    inputs:
      desktop_ref:
        description: Desktop branch/tag/SHA to pair with this Mobile ref
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pair-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Mobile under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: CNKH_POS_Mobile_APK

      - name: Select paired Desktop source
        id: companion
        env:
          REQUESTED_REF: ${{ github.event.inputs.desktop_ref }}
        shell: bash
        run: |
          set -euo pipefail
          paired_ref="$REQUESTED_REF"
          if [[ -z "$paired_ref" ]]; then
            paired_ref=$(tr -d '\r\n' < CNKH_POS_Mobile_APK/.github/paired-desktop-ref)
          fi
          [[ "$paired_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          echo "ref=$paired_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout release-paired Desktop companion
        uses: actions/checkout@v4
        with:
          repository: tyz11234/CNKH_POS_Desktop
          ref: ${{ steps.companion.outputs.ref }}
          path: CNKH_POS_Desktop

      - name: Record exact paired source SHAs
        shell: bash
        run: |
          set -euo pipefail
          echo "Mobile ref: ${{ github.event.pull_request.head.ref || github.ref_name }}"
          echo "Mobile SHA: $(git -C CNKH_POS_Mobile_APK rev-parse HEAD)"
          echo "Desktop ref: ${{ steps.companion.outputs.ref }}"
          echo "Desktop SHA: $(git -C CNKH_POS_Desktop rev-parse HEAD)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve paired integration dependencies
        working-directory: CNKH_POS_Desktop/integration
        run: flutter pub get

      - name: Analyze paired integration suite
        working-directory: CNKH_POS_Desktop/integration
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test real HTTP synchronization and reconnect
        working-directory: CNKH_POS_Desktop/integration
        run: flutter test test regression
