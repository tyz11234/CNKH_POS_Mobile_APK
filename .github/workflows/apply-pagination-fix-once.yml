name: Apply pagination fix once

on:
  push:
    branches:
      - fix/pagination-release-20260906

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/pagination-release-20260906
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply deterministic source patch
        run: python3 tools/apply_pagination_fix_once.py

      - name: Format changed Dart files
        run: dart format lib test

      - name: Pub get
        run: flutter pub get

      - name: Analyze strictly
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify INTERNET in merged manifest and APK
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find build/app/intermediates -path '*merged_manifest*release*AndroidManifest.xml' -o -path '*merged_manifests*release*AndroidManifest.xml' | head -n 1 || true)
          if [ -n "$manifest" ]; then
            echo "Merged manifest: $manifest"
            grep -n 'android.permission.INTERNET' "$manifest"
          else
            echo 'Merged manifest path not found; APK permission inspection remains mandatory.'
          fi
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          tool=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$tool" ]; then
            echo 'aapt not found' >&2
            exit 1
          fi
          echo "Permission tool: $tool"
          "$tool" dump permissions "$apk" | tee /tmp/apk-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt
          sha256sum "$apk" | tee /tmp/apk-sha256.txt
          grep '^version:' pubspec.yaml | tee /tmp/app-version.txt
          git rev-parse HEAD | tee /tmp/source-before-fix-commit.txt

      - name: Upload validated Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CNKH_POS_Mobile_pagination_fix_release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove one-time applicator and commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_pagination_fix_once.py .github/workflows/apply-pagination-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: paginate POS data and verify release networking'
          git push origin HEAD:fix/pagination-release-20260906
