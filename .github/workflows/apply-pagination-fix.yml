name: Apply pagination source patch

on:
  push:
    branches:
      - fix/pagination-release-20260906

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/pagination-release-20260906
          fetch-depth: 0

      - name: Apply scoped source fixes
        run: python3 scripts/apply_pagination_fix.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix pagination, purchase quantity and record paging'
          git push origin HEAD:fix/pagination-release-20260906
