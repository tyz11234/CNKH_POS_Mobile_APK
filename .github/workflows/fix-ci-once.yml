name: Fix pagination CI once

on:
  push:
    branches:
      - fix/pagination-release-20260906

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/pagination-release-20260906
          fetch-depth: 0

      - name: Apply focused fixes
        run: python3 tools/fix_ci_once.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix_ci_once.py .github/workflows/fix-ci-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix pagination CI syntax and verify release permission'
          git push origin HEAD:fix/pagination-release-20260906
