name: Mobile CI

on:
  push:
    branches:
      - main
      - source/main
      - feat/receipt-template-1.6.0
      - fix/lan-sync-consistency
    tags:
      - 'v*-mobile'
  pull_request:
    branches:
      - main
      - source/main
      - feat/receipt-template-1.6.0

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Checkout Desktop training source
        uses: actions/checkout@v4
        with:
          repository: tyz11234/CNKH_POS_Desktop
          ref: 02e3574b16d45bf0e13f89f5f1d1b42f50bfa3f3 # Desktop v0.4.0 release source
          path: .training_desktop

      - name: Capture actual Desktop training screens
        working-directory: .training_desktop
        run: |
          flutter pub get
          flutter test tool/training_capture_test.dart

      - name: Capture actual Mobile training screens
        run: |
          flutter test tool/training_capture_test.dart
          for name in pair backup einvoice_setup einvoice_credentials einvoice_history; do
            cp .training_desktop/assets/training/$name.png assets/training/
            cp .training_desktop/assets/training/$name.json assets/training/
          done

      - name: Upload training screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-training-screenshots
          path: assets/training/

      - name: Verify bundled training image and arrow
        run: flutter test tool/training_view_test.dart

      - name: Configure Android release signing
        env:
          CNKH_ANDROID_KEYSTORE_BASE64: ${{ secrets.CNKH_ANDROID_KEYSTORE_BASE64 }}
          CNKH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CNKH_ANDROID_KEYSTORE_PASSWORD }}
          CNKH_ANDROID_KEY_ALIAS: ${{ secrets.CNKH_ANDROID_KEY_ALIAS }}
          CNKH_ANDROID_KEY_PASSWORD: ${{ secrets.CNKH_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            key_path="$RUNNER_TEMP/cnkh-pr-validation.jks"
            store_password="pr-validation-only"
            key_alias="pr-validation"
            key_password="$store_password"
            keytool -genkeypair -noprompt \
              -keystore "$key_path" -storetype JKS \
              -storepass "$store_password" -keypass "$key_password" \
              -alias "$key_alias" -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=CNKH PR validation, O=CNKH, C=MY"
          else
            if [[ -z "$CNKH_ANDROID_KEYSTORE_BASE64" ||
                  -z "$CNKH_ANDROID_KEYSTORE_PASSWORD" ||
                  -z "$CNKH_ANDROID_KEY_ALIAS" ||
                  -z "$CNKH_ANDROID_KEY_PASSWORD" ]]; then
              echo '::error::Android release signing secrets are required to build an APK.'
              exit 1
            fi
            key_path="$RUNNER_TEMP/cnkh-pos-release.jks"
            store_password="$CNKH_ANDROID_KEYSTORE_PASSWORD"
            key_alias="$CNKH_ANDROID_KEY_ALIAS"
            key_password="$CNKH_ANDROID_KEY_PASSWORD"
            printf '%s' "$CNKH_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            test -s "$key_path"
          fi
          {
            echo "CNKH_ANDROID_KEYSTORE_PATH=$key_path"
            echo "CNKH_ANDROID_KEYSTORE_PASSWORD=$store_password"
            echo "CNKH_ANDROID_KEY_ALIAS=$key_alias"
            echo "CNKH_ANDROID_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Verify training assets in APK
        run: python3 tool/verify_training_bundle.py build/app/outputs/flutter-apk/app-release.apk --kind mobile

      - name: Verify Release INTERNET permission and identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Mobile source SHA: $(git rev-parse HEAD)"
          grep '^version:' pubspec.yaml
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -f "$apk"

          manifest=$(find build/app/intermediates \
            \( -path '*merged_manifest*release*AndroidManifest.xml' \
               -o -path '*merged_manifests*release*AndroidManifest.xml' \) \
            -print | head -n 1 || true)
          if [ -z "$manifest" ]; then
            echo 'Release merged AndroidManifest.xml not found' >&2
            exit 1
          fi
          echo "Merged manifest: $manifest"
          grep -n 'android.permission.INTERNET' "$manifest"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tool=$(find "$sdk_root/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$tool" ]; then
            echo 'aapt not found in Android SDK build-tools' >&2
            exit 1
          fi
          echo "Permission tool: $tool"
          "$tool" dump permissions "$apk" | tee /tmp/apk-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt

          signer=$(find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$signer" ]; then
            echo 'apksigner not found in Android SDK build-tools' >&2
            exit 1
          fi
          "$signer" verify --print-certs "$apk" | tee /tmp/apk-signing-cert.txt
          if grep -qi 'CN=Android Debug' /tmp/apk-signing-cert.txt; then
            echo 'Release APK must not use the Android debug certificate' >&2
            exit 1
          fi
          sha256sum "$apk" | tee /tmp/app-release.sha256

      - name: Stage APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          semver=${ver%%+*}
          src='build/app/outputs/flutter-apk/app-release.apk'
          test -f "$src"
          mkdir -p dist
          cp "$src" dist/CNKH_POS_Mobile.apk
          cp "$src" "dist/CNKH_POS_Mobile_v${semver}.apk"
          echo "RELEASE_TAG=v${semver}-mobile" >> "$GITHUB_ENV"
          echo "APP_VERSION=${ver}" >> "$GITHUB_ENV"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CNKH_POS_Mobile_release
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: CNKH POS Mobile ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
