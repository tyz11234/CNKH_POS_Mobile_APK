name: Mobile CI

on:
  push:
    branches:
      - source/main
      - feat/receipt-template-1.6.0
      - fix/lan-sync-consistency
  pull_request:
    branches:
      - source/main
      - feat/receipt-template-1.6.0

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # Keep analyzer errors fatal. The legacy Mobile source currently has
        # pre-existing info/warning lints outside this LAN-sync change scope.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNKH_POS_Mobile_release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
