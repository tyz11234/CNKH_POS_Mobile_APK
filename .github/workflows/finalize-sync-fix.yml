name: Finalize LAN Sync Fix

on:
  push:
    branches:
      - fix/lan-sync-consistency

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/lan-sync-consistency
          fetch-depth: 0

      - name: Apply safe cursor and version patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/services/lan_sync.dart')
          text = path.read_text(encoding='utf-8')

          old_call = """      final nextCursor = _nextCursor(\n        since,\n        <Map<String, dynamic>>[pBody, cBody, catBody],\n        <Object?>[...products, ...customers, ...categories],\n      );\n"""
          new_call = """      final nextCursor = _safeCatalogCursor(\n        since,\n        <Map<String, dynamic>>[pBody, cBody, catBody],\n        <Object?>[...products, ...customers, ...categories],\n      );\n"""
          if old_call not in text and new_call not in text:
              raise SystemExit('catalog cursor call pattern not found')
          text = text.replace(old_call, new_call, 1)

          marker = """  String _nextCursor(\n    String current,\n    List<Map<String, dynamic>> bodies,\n    Iterable<Object?> rawItems,\n  ) {\n"""
          helper = """  String _safeCatalogCursor(\n    String current,\n    List<Map<String, dynamic>> bodies,\n    Iterable<Object?> rawItems,\n  ) {\n    final currentNumeric = int.tryParse(current);\n    final cursors = <int>[];\n    for (final body in bodies) {\n      final value = body['cursor'];\n      final parsed = value is num ? value.toInt() : int.tryParse('$value');\n      if (parsed != null) cursors.add(parsed);\n    }\n    if (cursors.length == bodies.length && cursors.isNotEmpty) {\n      final safe = cursors.reduce(min);\n      if (currentNumeric != null && safe < currentNumeric) {\n        return '$currentNumeric';\n      }\n      return '$safe';\n    }\n    return _nextCursor(current, bodies, rawItems);\n  }\n\n"""
          if '_safeCatalogCursor(' not in text.split(marker)[0]:
              if marker not in text:
                  raise SystemExit('next cursor marker not found')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          p = p.replace('version: 1.6.0+18', 'version: 1.8.0+22', 1)
          pubspec.write_text(p, encoding='utf-8')

      - name: Commit finalized source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalize changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/lan_sync.dart pubspec.yaml
          git commit -m "fix: finalize LAN sync cursor safety"
          git push origin HEAD:fix/lan-sync-consistency
