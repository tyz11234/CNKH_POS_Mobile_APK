name: cnkh_pos_mobile
description: "CNKH Hardware POS Mobile companion — phone-first staff checkout with DuitNow QR."
publish_to: 'none'

version: 1.9.0+25

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  file_picker: ^8.1.7
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  intl: ^0.20.2
  uuid: ^4.5.1
  sqlite3: ^2.9.4
  mobile_scanner: ^7.0.1
  google_mlkit_text_recognition: ^0.16.0
  url_launcher: ^6.3.2
  flutter_contacts: ^1.1.9+2
  http: ^1.2.2
  web_socket_channel: ^3.0.2
  pdf: ^3.11.3
  share_plus: ^10.1.4
  print_bluetooth_thermal: ^1.2.1
  barcode: ^2.2.9
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/catalog.json
    - assets/seed_customers.json
    - assets/seed_suppliers.json
